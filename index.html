<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Movie VIP Logo</title>
    <style>
      body {
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: "Segoe UI", sans-serif;
      }

      .logo {
        padding: 20px 40px;
        border: 3px solid gold;
        border-radius: 12px;
        background: linear-gradient(145deg, #111, #222);
        box-shadow: 0 0 20px gold;
        color: gold;
        font-size: 40px;
        font-weight: bold;
        text-align: center;
        letter-spacing: 3px;
        text-shadow: 0 0 10px #ffd700, 0 0 5px #ffd700;
        position: relative;
      }

      .logo::after {
        content: "🎬";
        position: absolute;
        top: -20px;
        left: -20px;
        font-size: 30px;
      }

      .logo span {
        color: white;
        font-weight: normal;
      }
      .logo:hover::after {
        transform: rotate(360deg);
        transition: transform 0.5s ease-in-out;
      }
      p {
        color: gold;
        font-size: 20px;
        text-align: center;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="logo">
      Movie <span>VIP</span>
      <p>Không thể rời mắt</p>
    </div>
  </body>
</html>
