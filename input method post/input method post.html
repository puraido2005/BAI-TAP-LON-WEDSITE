<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Báo lỗi trang web phim</title>
  <link rel="stylesheet" href="/input method post .css">
</head>
<body>

<div class="form-container">
  <h2>Báo lỗi / Góp ý</h2>
  <form id="reportForm">
    <label for="name">Họ tên:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="issue">Vấn đề gặp phải:</label>
    <textarea id="issue" name="issue" rows="5" required></textarea>

    <button type="submit">Gửi phản hồi</button>
    <div id="message"></div>
  </form>
</div>

<script src="/input method post .js"></script>
</body>
</html>
